[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guangyaclient"
dynamic = ["version"]
description = "光鸭云盘 Python 客户端"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "DDSRem", email = "ddsrem@xnn.ee" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx[http2]",
]

[project.urls]
Homepage = "https://github.com/DDSRem-Dev/guangyaclient"
Repository = "https://github.com/DDSRem-Dev/guangyaclient"
Issues = "https://github.com/DDSRem-Dev/guangyaclient/issues"

[tool.hatch.version]
path = "guangyaclient/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["guangyaclient"]

[tool.hatch.build.targets.sdist]
include = [
    "guangyaclient/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]